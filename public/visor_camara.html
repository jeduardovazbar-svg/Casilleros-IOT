<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor de Seguridad - Casilleros</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; }
        #camera-feed { max-width: 100%; height: auto; border: 3px solid #4CAF50; border-radius: 8px; margin-top: 20px;}
        .status { padding: 10px; background: #333; margin: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Visor en Tiempo Real</h1>
    <div class="status" id="status-text">Esperando apertura de casillero...</div>
    
    <!-- Aquí es donde se pintará la foto/video de la ESP32-CAM -->
    <img id="camera-feed" src="" alt="La cámara está apagada" style="display: none;">

    <script>
  const imgElement = document.querySelector('img');
  const statusText = document.querySelector('div, p'); // Tu contenedor con el texto de espera

  // Conectar al servidor Node.js
  const ws = new WebSocket(`ws://${window.location.host}`);
  
  // OBLIGATORIO: Asegura que los datos de la ESP32-CAM se reciban como Blob
  ws.binaryType = 'blob';

  ws.onopen = () => {
    console.log('[WS] Conectado al visor web');
  };

  ws.onmessage = (event) => {
    // 1. Recepción de fotograma binario JPEG
    if (event.data instanceof Blob) {
      const imageUrl = URL.createObjectURL(event.data);
      imgElement.src = imageUrl;

      // Hacemos visible la imagen y ocultamos el texto de espera
      imgElement.style.display = 'block';
      if (statusText) statusText.style.display = 'none';

      // Liberar la URL de memoria una vez cargado el cuadro
      imgElement.onload = () => URL.revokeObjectURL(imageUrl);
    } 
    // 2. Recepción de telemetría de texto
    else {
      try {
        const data = JSON.parse(event.data);

        if (data.type === 'DOOR_STATUS_UPDATE') {
          if (data.status === 'cerrada') {
            // Ocultar imagen y restaurar texto de espera
            imgElement.style.display = 'none';
            if (statusText) {
              statusText.style.display = 'block';
              statusText.innerText = "Esperando apertura de casillero...";
            }
          } else if (data.status === 'abierta') {
            if (statusText) {
              statusText.innerText = "Iniciando transmisión de video...";
            }
          }
        }
      } catch (e) {
        console.error("Error parseando telemetría:", e);
      }
    }
  };

  ws.onclose = () => {
    console.warn('[WS] Conexión cerrada con el backend');
  };
</script>
</body>
</html>
